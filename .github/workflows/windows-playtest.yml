name: Windows playtest EXE

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-playtest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-game:
    runs-on: windows-latest
    steps:
      - name: Check out combat-and-runes game
        uses: actions/checkout@v4
        with:
          ref: combat-and-runes

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build self-contained Windows x64 game
        shell: pwsh
        run: |
          dotnet publish src/Roguelike.App/Roguelike.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist/windows

      - name: Verify game is ready to download
        shell: pwsh
        run: |
          foreach ($asset in @('Roguelike.App.exe', 'data/skills.json', 'Fonts')) {
            if (!(Test-Path "dist/windows/$asset")) { throw "Missing $asset in Windows build" }
          }

      - name: Upload Windows EXE and assets
        uses: actions/upload-artifact@v4
        with:
          name: Roguelike-Windows-Playtest
          path: dist/windows/
          retention-days: 30
          if-no-files-found: error
